<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow-x:hidden;
}

.container{
    margin-top:40px;
}

h1{
    color:white;
    font-size:3rem;
    text-shadow:2px 2px 10px black;
}

img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:50%;
    border:6px solid white;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.message{
    width:80%;
    max-width:700px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    font-size:1.2rem;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:#ff4081;
    color:white;
    margin-top:20px;
}

button:hover{
    transform:scale(1.05);
}

#surprise{
    display:none;
    margin-top:20px;
    color:white;
    font-size:2rem;
    font-weight:bold;
}

.balloon{
    position:absolute;
    bottom:-150px;
    width:60px;
    height:80px;
    border-radius:50%;
    animation:float 10s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(-120vh);
    }
}
</style>
</head>

<body>

<audio id="song">
    <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>🎂 Happy Birthday Antara 🎂</h1>

<img src="photo (3).jpeg" alt="Birthday Girl">

<div class="message">
    Dear Antara,<br><br>

    Wishing you a day filled with happiness, laughter,
    love, and unforgettable memories. 💖

    Thank you for being such an amazing friend.
    May all your dreams come true and may this year
    bring you endless success and joy. ✨🎉
</div>

<button onclick="showSurprise()">
🎁 Click For Your Surprise
</button>

<div id="surprise">
🎊 Have the Best Birthday Ever! 🎊
</div>

</div>

<script>

function showSurprise(){
    document.getElementById("surprise").style.display="block";
    document.getElementById("song").play();

    for(let i=0;i<25;i++){
        let balloon=document.createElement("div");
        balloon.classList.add("balloon");

        balloon.style.left=Math.random()*100+"vw";
        balloon.style.backgroundColor=
        `hsl(${Math.random()*360},100%,70%)`;

        document.body.appendChild(balloon);

        setTimeout(()=>{
            balloon.remove();
        },10000);
    }
}

</script>

</body>
</html>
